# Installed to /etc/systemd/system.conf.d/luckylogic-watchdog.conf.
# Arms the hardware watchdog (Intel iTCO on the HP/Dell minis). If the
# kernel hangs and systemd stops petting it for 30s, the board resets
# itself and the player boots straight back to the controller page.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
